# ═══════════════════════════════════════════════════════════════
# RETRO CRT / SYNTHWAVE HYPRLOCK CONFIGURATION
# ═══════════════════════════════════════════════════════════════

background {
    monitor =
    path = /home/gopal/.config/hypr/wallpapers/retro_synthwave.png
    blur_passes = 1
    blur_size = 4
    noise = 0.02
    contrast = 0.95
    brightness = 0.75
}

# Clock (Large Retro CRT Display)
label {
    monitor =
    text = $TIME
    color = rgb(0, 243, 255)
    font_size = 96
    font_family = VT323
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 243, 255, 0.6)
}

# Date (Retro Synth Magenta)
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d, %Y"
    color = rgb(255, 42, 133)
    font_size = 30
    font_family = VT323
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(255, 42, 133, 0.5)
}

# Retro Terminal Security Banner
label {
    monitor =
    text = [ SYS_TERMINAL: AUTHENTICATION_REQUIRED ]
    color = rgb(5, 255, 161)
    font_size = 14
    font_family = Press Start 2P
    position = 0, -45
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(5, 255, 161, 0.4)
}

# Password Input Field
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(255, 42, 133)
    inner_color = rgba(18, 14, 28, 0.92)
    font_color = rgb(0, 243, 255)
    fade_on_empty = false
    font_family = VT323
    placeholder_text = <span foreground="##8c82a2">ENTER_PASSCODE...</span>
    hide_input = false
    rounding = 4
    check_color = rgb(255, 230, 0)
    fail_color = rgb(255, 42, 133)
    fail_text = ACCESS DENIED ($ATTEMPTS)
    capslock_color = rgb(255, 230, 0)
    position = 0, -115
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(255, 42, 133, 0.5)
}

# Bottom Telemetry / System Prompt
label {
    monitor =
    text = cmd[update:3000] echo "NODE: $HOSTNAME // USER: $USER // STATUS: READY"
    color = rgb(255, 230, 0)
    font_size = 18
    font_family = VT323
    position = 0, 35
    halign = center
    valign = bottom
}
