# ───────────────────────────────────────────────────────────────
# MODERN BLUR LOCK SCREEN — Frosted Glass with Fluid Typography
# ───────────────────────────────────────────────────────────────

general {
    hide_cursor = false
    grace = 1
    disable_loading_bar = true
}

# ── Blurry Frosted Wallpaper Background ──
background {
    monitor =
    path = /home/gopal/.config/hypr/wallpapers/modern_art_blurred.png
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.88
    brightness = 0.72
    vibrancy = 0.22
    vibrancy_darkness = 0.1
}

# ── Large Modern Clock & Date (Top) ──
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(255, 255, 255)
    font_size = 80
    font_family = Fira Sans Bold
    position = 0, 320
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(201, 190, 255, 0.9)
    font_size = 18
    font_family = Fira Sans Medium
    position = 0, 245
    halign = center
    valign = center
}

# ── Central Frosted Glass Card ──
shape {
    monitor =
    size = 360, 420
    color = rgba(20, 19, 24, 0.65)
    rounding = 28
    border_size = 1
    border_color = rgba(201, 190, 255, 0.25)
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── Avatar / User Ring ──
shape {
    monitor =
    size = 84, 84
    color = rgba(201, 190, 255, 0.15)
    rounding = 42
    border_size = 2
    border_color = rgba(201, 190, 255, 0.6)
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰀉
    color = rgb(201, 190, 255)
    font_size = 40
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 95
    halign = center
    valign = center
}

# ── User Name & Status ──
label {
    monitor =
    text = $USER
    color = rgb(230, 225, 233)
    font_size = 18
    font_family = Fira Sans SemiBold
    position = 0, 32
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾 Locked Session
    color = rgba(230, 225, 233, 0.55)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 10
    halign = center
    valign = center
}

# ── Password Input Field ──
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 2
    rounding = 23
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(32, 31, 37, 0.8)
    outer_color = rgba(201, 190, 255, 0.4)
    font_color = rgb(230, 225, 233)
    font_family = Fira Sans
    fade_on_empty = false
    placeholder_text = <span foreground="##c9beff88">Enter password...</span>
    check_color = rgba(201, 190, 255, 0.9)
    fail_color = rgba(255, 180, 171, 0.9)
    fail_text = <span foreground="##ffb4ab"><i>Incorrect ($ATTEMPTS)</i></span>
    capslock_color = rgba(255, 214, 102, 0.9)
    position = 0, -50
    halign = center
    valign = center
}

# ── Battery & System Status (Bottom of Card) ──
label {
    monitor =
    text = cmd[update:10000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 100)%"
    color = rgba(201, 190, 255, 0.75)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -115
    halign = center
    valign = center
}

# ── Subtle Keyboard Hint ──
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(230, 225, 233, 0.4)
    font_size = 11
    font_family = Fira Sans
    position = 0, -170
    halign = center
    valign = center
}
