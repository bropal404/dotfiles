# ───────────────────────────────────────────────────────────────
#  D U N E  —  lockscreen as a cinematic title card
#  GENERATED by scripts/gen-hyprlock.py — edit that, not this file.
# ───────────────────────────────────────────────────────────────

$sand  = rgba(234, 197, 178, 1.0)
$sandD = rgba(234, 197, 178, 0.6)
$spice = rgba(217, 138, 78, 1.0)
$night = rgba(13, 11, 10, 1.0)
$font  = Lexend Peta

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = haze, 0.45, 0, 0.25, 1
    animation = fadeIn, 0                 # instant: a slow fade-in shows the desktop for ~1s after waking from sleep
    animation = fadeOut, 1, 6, haze
    animation = inputFieldDots, 1, 3, haze
}

background {
    monitor =
    path = /home/gopal/.config/hypr/wallpapers/dune_lock.jpg
    blur_passes = 2
    blur_size = 4
    noise = 0.04
    brightness = 0.75
    contrast = 1.0
    vibrancy = 0.1
}

# ════════════════ eDP-1  (×1.4) ════════════════

# letterbox
shape {
    monitor = eDP-1
    size = 8000, 154
    color = $night
    rounding = 0
    zindex = 0
    position = 0, 0
    halign = center
    valign = top
}
shape {
    monitor = eDP-1
    size = 8000, 154
    color = $night
    rounding = 0
    zindex = 0
    position = 0, 0
    halign = center
    valign = bottom
}

# clock
label {
    monitor = eDP-1
    zindex = 10
    text = cmd[update:1000] echo "<span letter_spacing='56000'>$(date +%H)  $(date +%M)</span>"
    color = $sand
    font_size = 129
    font_family = $font Thin
    position = 0, 238
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# eclipse flare
shape {
    monitor = eDP-1
    zindex = 10
    size = 1008, 1
    color = rgba(234, 197, 178, 0.45)
    rounding = 0
    position = 0, 98
    halign = center
    valign = center
}
shape {
    monitor = eDP-1
    zindex = 10
    size = 308, 1
    color = rgba(255, 240, 230, 0.9)
    rounding = 0
    position = 0, 98
    halign = center
    valign = center
}
shape {
    monitor = eDP-1
    zindex = 10
    size = 15, 15
    color = rgba(10, 10, 14, 1.0)
    rounding = -1
    border_size = 3
    border_color = rgba(255, 244, 236, 1.0)
    position = 0, 98
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(255, 220, 190, 0.9)
}

# date
label {
    monitor = eDP-1
    zindex = 10
    text = cmd[update:60000] echo "<span letter_spacing='12600'>$(date '+%A   ·   %d %B' | tr a-z A-Z)</span>"
    color = $spice
    font_size = 18
    font_family = $font Light
    position = 0, 39
    halign = center
    valign = center
}

# password
input-field {
    monitor = eDP-1
    zindex = 10
    size = 588, 62
    outline_thickness = 1
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.9
    dots_center = true
    dots_rounding = -1
    dots_text_format = ◆
    inner_color = rgba(13, 11, 10, 0.35)
    outer_color = rgba(234, 197, 178, 0.35)
    check_color = rgba(217, 138, 78, 0.9)
    fail_color = rgba(224, 86, 59, 0.95)
    capslock_color = rgba(142, 201, 255, 0.9)
    font_color = $sand
    font_family = $font Light
    fade_on_empty = false
    placeholder_text = <span letter_spacing="8400" foreground="##eac5b299">THE SLEEPER MUST AWAKEN</span>
    fail_text = <span letter_spacing="8400">ACCESS DENIED · $ATTEMPTS</span>
    fail_timeout = 2500
    position = 0, -126
    halign = center
    valign = center
}

# lower letterbox: litany · place · power
label {
    monitor = eDP-1
    zindex = 10
    text = <span letter_spacing="9800">FEAR IS THE MIND-KILLER</span>
    color = $sandD
    font_size = 13
    font_family = $font Light
    position = 84, 64
    halign = left
    valign = bottom
}
label {
    monitor = eDP-1
    zindex = 10
    text = cmd[update:30000] echo "<span letter_spacing='9800'>ARRAKIS  ·  $(whoami | tr a-z A-Z)  ·  $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%</span>"
    color = $sandD
    font_size = 13
    font_family = $font Light
    position = -84, 64
    halign = right
    valign = bottom
}

# upper letterbox: keyboard layout
label {
    monitor = eDP-1
    zindex = 10
    text = <span letter_spacing="9800">$LAYOUT</span>
    color = rgba(234, 197, 178, 0.4)
    font_size = 11
    font_family = $font Light
    position = 0, -67
    halign = center
    valign = top
}

