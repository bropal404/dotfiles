# ───────────────────────────────────────────────────────────────
#  D U N E  —  lockscreen as a cinematic title card
#  letterbox bars · thin tracked type · eclipse flare · spice accents
# ───────────────────────────────────────────────────────────────

$sand  = rgba(234, 197, 178, 1.0)
$sandD = rgba(234, 197, 178, 0.55)
$spice = rgba(217, 138, 78, 1.0)
$night = rgba(13, 11, 10, 1.0)
$font  = Lexend Peta
$fontB = Lexend

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = haze, 0.45, 0, 0.25, 1
    animation = fadeIn, 1, 9, haze
    animation = fadeOut, 1, 6, haze
    animation = inputFieldDots, 1, 3, haze
}

background {
    monitor =
    path = /home/gopal/.config/hypr/wallpapers/dune_lock.jpg
    blur_passes = 2
    blur_size = 4
    noise = 0.04
    brightness = 0.75
    contrast = 1.0
    vibrancy = 0.1
}

# ── letterbox (2.39:1 feel) ──
shape {
    monitor =
    size = 6000, 110
    color = $night
    rounding = 0
    position = 0, 0
    halign = center
    valign = top
}
shape {
    monitor =
    size = 6000, 110
    color = $night
    rounding = 0
    position = 0, 0
    halign = center
    valign = bottom
}

# ── the clock: thin, ultra-wide, tracked ──
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='40000'>$(date +%H)  $(date +%M)</span>"
    color = $sand
    font_size = 92
    font_family = $font Thin
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── eclipse flare: a hairline with a burning point ──
shape {
    monitor =
    size = 720, 1
    color = rgba(234, 197, 178, 0.45)
    rounding = 0
    position = 0, 70
    halign = center
    valign = center
}
shape {
    monitor =
    size = 220, 1
    color = rgba(255, 240, 230, 0.9)
    rounding = 0
    position = 0, 70
    halign = center
    valign = center
}
shape {
    monitor =
    size = 11, 11
    color = rgba(10, 10, 14, 1.0)
    rounding = -1
    border_size = 2
    border_color = rgba(255, 244, 236, 1.0)
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(255, 220, 190, 0.9)
}

# ── date ──
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(date '+%A   ·   %d %B' | tr a-z A-Z)</span>"
    color = $spice
    font_size = 13
    font_family = $font Light
    position = 0, 28
    halign = center
    valign = center
}

# ── password: a single line in the sand ──
input-field {
    monitor =
    size = 420, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.9
    dots_center = true
    dots_rounding = -1
    dots_text_format = ◆
    inner_color = rgba(13, 11, 10, 0.35)
    outer_color = rgba(234, 197, 178, 0.35)
    check_color = rgba(217, 138, 78, 0.9)
    fail_color = rgba(224, 86, 59, 0.95)
    capslock_color = rgba(142, 201, 255, 0.9)
    font_color = $sand
    font_family = $font Light
    fade_on_empty = false
    placeholder_text = <span letter_spacing="6000" foreground="##eac5b299">THE SLEEPER MUST AWAKEN</span>
    fail_text = <span letter_spacing="6000">ACCESS DENIED · $ATTEMPTS</span>
    fail_timeout = 2500
    position = 0, -90
    halign = center
    valign = center
}

# ── lower letterbox: litany, place, power ──
label {
    monitor =
    text = <span letter_spacing="7000">FEAR IS THE MIND-KILLER</span>
    color = $sandD
    font_size = 9
    font_family = $font Light
    position = 60, 46
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] echo "<span letter_spacing='7000'>ARRAKIS  ·  $(whoami | tr a-z A-Z)  ·  $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%</span>"
    color = $sandD
    font_size = 9
    font_family = $font Light
    position = -60, 46
    halign = right
    valign = bottom
}

# ── upper letterbox: subtle caps-lock / layout hint ──
label {
    monitor =
    text = <span letter_spacing="7000">$LAYOUT</span>
    color = rgba(234, 197, 178, 0.35)
    font_size = 8
    font_family = $font Light
    position = 0, -48
    halign = center
    valign = top
}
