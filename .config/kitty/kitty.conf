# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                     KITTY · MODERN RETRO AMBER                                ║
# ║            Readable cream text, amber accents, powerline tabs, soft CRT   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── SHELL ──────────────────────────────────────────────────────────────────────
shell                       /usr/bin/fish
shell_integration           enabled
term                        xterm-kitty

# ── WINDOW ─────────────────────────────────────────────────────────────────────
remember_window_size        yes
initial_window_width        110c
initial_window_height       34c
window_padding_width        16
window_margin_width         2
single_window_margin_width  0
window_border_width         1pt
placement_strategy          center
inactive_text_alpha         0.70
hide_window_decorations     no

# ── CRT SCREEN ─────────────────────────────────────────────────────────────────
# Subtle scanlines: 1x3 px tile, gap row barely darker. Delete these 4 lines to disable
background_image            ~/.config/kitty/scanlines.png
background_image_layout     tiled
background_image_linear     no
background_tint             0.0
background_opacity          0.94
dynamic_background_opacity  yes

# Slightly fuller glyphs for a gentle phosphor feel (kept readable)
text_composition_strategy   1.15 10

# ── MODERN RETRO AMBER COLORS ──────────────────────────────────────────────────
# Body text is warm cream (easy on the eyes); amber is reserved for accents
foreground                  #EAD9BF
background                  #15110D

selection_foreground        #15110D
selection_background        #F0A830

cursor                      #FFB000
cursor_text_color           #15110D

url_color                   #F5C26B
url_style                   curly

active_border_color         #F0A830
inactive_border_color       #3A2E22
bell_border_color           #E8704A
visual_bell_color           #3A2E22

mark1_foreground            #15110D
mark1_background            #F0A830
mark2_foreground            #15110D
mark2_background            #A9B97F
mark3_foreground            #15110D
mark3_background            #86AFC2

# ANSI palette: warm-tinted but clearly distinct hues for diffs, ls, compilers
color0                      #2A221A
color1                      #E06C4C
color2                      #A9B97F
color3                      #F0A830
color4                      #86AFC2
color5                      #C49AB4
color6                      #85B9A8
color7                      #EAD9BF

# Bright ANSI palette
color8                      #7D6B58
color9                      #F28E6E
color10                     #C3D39A
color11                     #FFC457
color12                     #A6C8D8
color13                     #DDB4CC
color14                     #A3D4C3
color15                     #FFF5E6

# ── TYPOGRAPHY ─────────────────────────────────────────────────────────────────
# BlexMono = IBM Plex Mono (IBM terminal heritage) patched with Nerd/powerline glyphs
# font_family                 family="BlexMono Nerd Font Mono"
# bold_font                   auto
# italic_font                 auto
# bold_italic_font            auto
font_size                   12.0
modify_font                 cell_height 118%
disable_ligatures           cursor
box_drawing_scale           0.001, 1, 1.5, 2
undercurl_style             thin-sparse

# ── CURSOR ─────────────────────────────────────────────────────────────────────
# Classic steady block. Set cursor_blink_interval 0.6 if you want blinking back.
cursor_shape                block
cursor_blink_interval       0
cursor_trail                0

# ── SCROLLBACK ─────────────────────────────────────────────────────────────────
scrollback_lines            50000
scrollback_pager            less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier     3.0

# ── TABS · powerline ───────────────────────────────────────────────────────────
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         round
tab_bar_align               left
tab_bar_min_tabs            1
tab_bar_margin_width        0
tab_bar_margin_height       0 0
tab_bar_background          #15110D
tab_activity_symbol         ""
tab_title_template          " {index}  {title} "
active_tab_foreground       #15110D
active_tab_background       #F0A830
active_tab_font_style       bold
inactive_tab_foreground     #C4B49C
inactive_tab_background     #2A221A
inactive_tab_font_style     normal
tab_switch_strategy         previous

# ── LAYOUTS ────────────────────────────────────────────────────────────────────
enabled_layouts             splits,tall,fat,grid,stack
window_resize_step_cells    2
window_resize_step_lines    2

# ── MOUSE / SELECTION ──────────────────────────────────────────────────────────
copy_on_select              clipboard
select_by_word_characters   @-./_~?&=%+#
mouse_hide_wait             2.0
default_pointer_shape       beam

# ── LINKS ──────────────────────────────────────────────────────────────────────
detect_urls                 yes
open_url_with               default
show_hyperlink_targets      yes
underline_hyperlinks        hover

# ── CLIPBOARD / SECURITY ───────────────────────────────────────────────────────
clipboard_control           write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_remote_control        no
allow_cloning               ask

# ── NOTIFICATIONS ──────────────────────────────────────────────────────────────
enable_audio_bell           no
visual_bell_duration        0.0
window_alert_on_bell        yes

# ── PERFORMANCE / BATTERY ──────────────────────────────────────────────────────
repaint_delay               10
input_delay                 3
sync_to_monitor             yes
linux_display_server        auto
wayland_enable_ime          yes
update_check_interval       0

# ── EDITOR ─────────────────────────────────────────────────────────────────────
editor                      nvim
close_on_child_death        no

# ── KEYBOARD SHORTCUTS ─────────────────────────────────────────────────────────

# Command palette
map ctrl+shift+p            command_palette

# Clipboard
map ctrl+shift+c            copy_to_clipboard
map ctrl+shift+v            paste_from_clipboard
map shift+insert            paste_from_selection

# Scrollback and shell integration
map ctrl+shift+h            show_scrollback
map ctrl+shift+g            show_last_command_output
map ctrl+shift+/            search_scrollback
map ctrl+alt+up             scroll_to_prompt -1
map ctrl+alt+down           scroll_to_prompt 1

# FZF search through screen + scrollback (--ansi keeps colours readable)
map ctrl+shift+f            launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting fzf --ansi --no-sort --no-mouse --exact -i --tac

# Font sizing
map ctrl+equal              change_font_size all +1.0
map ctrl+plus               change_font_size all +1.0
map ctrl+kp_add             change_font_size all +1.0
map ctrl+minus              change_font_size all -1.0
map ctrl+kp_subtract        change_font_size all -1.0
map ctrl+0                  change_font_size all 0

# CRT "brightness knob": opacity up / down / reset
map ctrl+shift+a>up         set_background_opacity +0.05
map ctrl+shift+a>down       set_background_opacity -0.05
map ctrl+shift+a>0          set_background_opacity default

# Windows / splits
map ctrl+shift+enter        new_window_with_cwd
map ctrl+shift+n            new_os_window_with_cwd
map ctrl+shift+w            close_window
map ctrl+shift+]            next_window
map ctrl+shift+[            previous_window
map ctrl+shift+r            start_resizing_window
map ctrl+alt+h              neighboring_window left
map ctrl+alt+j              neighboring_window down
map ctrl+alt+k              neighboring_window up
map ctrl+alt+l              neighboring_window right
map f6                      launch --location=vsplit --cwd=current
map f5                      launch --location=hsplit --cwd=current
map f4                      layout_action rotate
map ctrl+shift+l            next_layout
map ctrl+shift+1            goto_layout splits
map ctrl+shift+2            goto_layout tall
map ctrl+shift+3            goto_layout grid

# Tabs
map ctrl+t                  new_tab
map ctrl+shift+q            close_tab
map ctrl+shift+right        next_tab
map ctrl+shift+left         previous_tab
map ctrl+shift+.            move_tab_forward
map ctrl+shift+,            move_tab_backward
map ctrl+alt+t              set_tab_title

# Zed / VS Code in current directory
map ctrl+shift+z            launch --cwd=current zeditor .
map ctrl+shift+x            launch --cwd=current code .

# Kitty utilities
map ctrl+shift+u            kitten unicode_input
map ctrl+shift+escape       kitty_shell window
map ctrl+shift+f2           edit_config_file
map ctrl+shift+f5           load_config_file
map ctrl+shift+f6           debug_config
map ctrl+shift+delete       clear_terminal reset active
map ctrl+l                  clear_terminal clear active
map ctrl+shift+f10          toggle_fullscreen
map ctrl+shift+f11          toggle_maximized


# BEGIN_KITTY_FONTS
font_family      family='BlexMono Nerd Font Mono' postscript_name=BlexMonoNFM
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
