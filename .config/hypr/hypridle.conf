general {
    lock_cmd = ~/.config/hypr/scripts/lock
    # lock, then HOLD the suspend until hyprlock is actually up and has drawn a frame
    before_sleep_cmd = sh -c 'loginctl lock-session; for i in $(seq 40); do pidof hyprlock >/dev/null && break; sleep 0.1; done; sleep 0.7'
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {                       # dim after 2.5 min
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {                       # lock after 5 min
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {                       # screens off after 5.5 min
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

listener {                       # suspend after 15 min
    timeout = 900
    on-timeout = systemctl suspend
}
