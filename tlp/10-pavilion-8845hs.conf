# TLP 1.11 drop-in for HP Pavilion Plus 14 (Ryzen 7 8845HS / Radeon 780M / MT7922 / NVMe)
# Install:  sudo install -Dm644 10-pavilion-8845hs.conf /etc/tlp.d/10-pavilion-8845hs.conf && sudo tlp start
# Profiles: PRF = performance (AC), BAL = balanced (unused), SAV = power saver (battery)

TLP_ENABLE=1
TLP_AUTO_SWITCH=2          # AC -> PRF, battery -> SAV, automatically
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV

# ── CPU (amd-pstate-epp: governor stays "powersave"; EPP does the real work) ──
CPU_DRIVER_OPMODE_ON_PRF=active
CPU_DRIVER_OPMODE_ON_SAV=active
CPU_SCALING_GOVERNOR_ON_PRF=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_PRF=1
CPU_BOOST_ON_SAV=0               # biggest battery win; set 1 if the UI feels sluggish
# Hard frequency ceiling on battery (kHz). Chip tops out at 5.1GHz. Browsing/text work is fine
# at 1.4GHz; below ~1.1GHz (amd-pstate "lowest non-linear") the CPU stops getting more efficient,
# so don't go lower than that. Need more speed? Switch the Power Saver tile to Off (AC mode).
CPU_SCALING_MIN_FREQ_ON_SAV=400000
CPU_SCALING_MAX_FREQ_ON_SAV=1400000

# ── Platform profile (this HP offers: quiet / balanced / performance) ──
PLATFORM_PROFILE_ON_PRF=performance
PLATFORM_PROFILE_ON_SAV=quiet

# ── GPU (Radeon 780M) ──
RADEON_DPM_PERF_LEVEL_ON_PRF=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=auto  # "low" saves more but stutters 2880x1800@120Hz + blur
AMDGPU_ABM_LEVEL_ON_PRF=0          # panel power-saving off on AC (accurate colour)
AMDGPU_ABM_LEVEL_ON_SAV=3          # 0-4; lower if colours look washed out on battery

# ── PCIe / storage ──
PCIE_ASPM_ON_PRF=default
PCIE_ASPM_ON_SAV=powersupersave
RUNTIME_PM_ON_PRF=on
RUNTIME_PM_ON_SAV=auto
AHCI_RUNTIME_PM_ON_PRF=on
AHCI_RUNTIME_PM_ON_SAV=auto

# ── Wi-Fi / USB / audio ──
WIFI_PWR_ON_PRF=off
WIFI_PWR_ON_SAV=on
WOL_DISABLE=Y
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1              # keep Bluetooth stable
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_AUDIO=1              # no dropouts on USB DACs / headsets
SOUND_POWER_SAVE_ON_PRF=0
SOUND_POWER_SAVE_ON_SAV=1
SOUND_POWER_SAVE_CONTROLLER=Y

NMI_WATCHDOG=0

# Battery charge thresholds omitted: this HP's firmware doesn't expose them.
