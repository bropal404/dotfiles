# ───────────────────────────────────────────────────────────────
# WARM RETRO HYPRLOCK — amber terminal login
# ───────────────────────────────────────────────────────────────

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/gopal/.config/hypr/wallpapers/retro_stripes.png
    blur_passes = 0
    brightness = 0.55
}

# Big clock
label {
    monitor =
    text = $TIME
    color = rgb(e08a2e)
    font_size = 120
    font_family = VT323
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A  %d %B %Y" | tr a-z A-Z
    color = rgb(e6d5b0)
    font_size = 28
    font_family = VT323
    position = 0, 60
    halign = center
    valign = center
}

# Prompt line
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(cat /etc/hostname 2>/dev/null) :: LOCKED"
    color = rgb(9a8a6e)
    font_size = 22
    font_family = VT323
    position = 0, -10
    halign = center
    valign = center
}

# Password field — a flat terminal box with block "dots"
input-field {
    monitor =
    size = 360, 52
    outline_thickness = 2
    rounding = 0
    dots_size = 0.30
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = 0
    outer_color = rgb(4a3f31)
    inner_color = rgb(1b1814)
    font_color = rgb(e08a2e)
    font_family = VT323
    fade_on_empty = false
    placeholder_text = <span foreground="##9a8a6e">PASSWORD_</span>
    check_color = rgb(d9b24a)
    fail_color = rgb(c0552b)
    fail_text = <span foreground="##c0552b">ACCESS DENIED [$ATTEMPTS]</span>
    capslock_color = rgb(d9b24a)
    position = 0, -80
    halign = center
    valign = center
}

# Footer hint
label {
    monitor =
    text = ░▒▓  TYPE PASSWORD + RETURN  ▓▒░
    color = rgb(4a3f31)
    font_size = 18
    font_family = VT323
    position = 0, 40
    halign = center
    valign = bottom
}
